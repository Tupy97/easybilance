<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EasyBilance</title>
<meta name="description" content="Registra le spese, segui il budget extra e il bilancio mensile.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Direzione: carta topografica / strumento di misura. Nebbia verde-grigia, inchiostro scuro, verde acqua come accento, ocra per gli extra. */
:root{
  --bg:#E6ECEA; --surface:#F7F9F8; --surface-2:#EAF0EE; --ink:#0F1C1F; --muted:#51656A; --line:#CBD6D3;
  --accent:#0B5D5B; --on-accent:#FFFFFF; --accent-soft:#D3E7E4;
  --need:#2F6DB5; --need-ink:#25599A; --on-need:#FFFFFF; --need-soft:#DCE8F5; --extra:#D08A1C; --extra-soft:#F6E8CC;
  --good:#1B6B48; --good-soft:#D9EFE3; --bad:#B2332D; --bad-soft:#F6DEDB; --warn:#855000;
  --hero:#0F2A2C; --hero-ink:#E8F1F0; --hero-muted:#9DB8B7; --hero-acc:#5ED8BC; --hero-pos:#7CE3B0; --hero-neg:#FF9F95;
  --bar:#12262A; --on-bar:#B7C9CB; --bar-act:#5ED8BC; --on-bar-act:#062A24;
  --shadow:none;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1315; --surface:#111D20; --surface-2:#17262A; --ink:#E6EFEE; --muted:#8FA3A6; --line:#223539;
    --accent:#5ED8BC; --on-accent:#062A24; --accent-soft:#12332F;
    --need:#6FA8F0; --need-ink:#6FA8F0; --on-need:#0A1315; --need-soft:#17283F; --extra:#E8A843; --extra-soft:#35290F;
    --good:#5CC08C; --good-soft:#12301F; --bad:#EE7C72; --bad-soft:#3A1C1A; --warn:#E6A94A;
    --hero:#15373A; --bar:#1B3236; --on-bar:#A9BFC2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1315; --surface:#111D20; --surface-2:#17262A; --ink:#E6EFEE; --muted:#8FA3A6; --line:#223539;
  --accent:#5ED8BC; --on-accent:#062A24; --accent-soft:#12332F;
  --need:#6FA8F0; --need-ink:#6FA8F0; --on-need:#0A1315; --need-soft:#17283F; --extra:#E8A843; --extra-soft:#35290F;
  --good:#5CC08C; --good-soft:#12301F; --bad:#EE7C72; --bad-soft:#3A1C1A; --warn:#E6A94A;
  --hero:#15373A; --bar:#1B3236; --on-bar:#A9BFC2;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button,summary{cursor:pointer}
button,.chip,.item,.set-item,.tap,.btn{transition:background-color .15s ease,color .15s ease,transform .12s ease,filter .15s ease}
button:active:not(:disabled){transform:scale(.97)}
.item:active,.set-item:active{background:var(--surface-2)}
@media (hover:hover){.item:hover,.set-item:hover{background:var(--surface-2)}.chip:hover{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.todo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.todo:first-of-type{border-top:0}
.todo .link{flex:none}
.todo-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 0 2px;border-top:1px solid var(--line)}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;margin:6px 2px 8px;min-height:44px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s ease;margin-right:6px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.steps{display:flex;gap:6px;margin:-4px 0 14px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.bigamt{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.02em}
.bar2{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:14px 0 10px}
.bar2 i{display:block;height:100%}
.chart-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
details.more{border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:6px 0 14px}
details.more summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:600;font-size:14.5px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s ease;margin-right:4px}
details.more[open] summary::after{transform:rotate(-135deg)}
details.more[open]{padding-bottom:4px}
.item,.set-item{border-radius:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.period{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.period svg{width:18px;height:18px}
.period button{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.period button:hover{background:var(--surface-2);color:var(--ink)}
.privacy-btn{border:0;background:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.privacy-btn:hover{background:var(--surface-2);color:var(--ink)}
.privacy-btn svg{width:20px;height:20px}
.privacy-btn[aria-pressed="true"]{color:var(--accent)}
.period span{font-weight:600;font-size:14px;min-width:96px;text-align:center;text-transform:capitalize}
main{padding-inline:16px;display:flex;flex-direction:column;gap:14px}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0}
.mid{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin-top:4px}
.sub{color:var(--muted);font-size:13px;line-height:1.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px -4px}
.sect-h h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:11px 8px;margin:-11px -8px}

.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:14px 0 10px}
.split i{display:block;height:100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.need-c{background:var(--need)} .extra-c{background:var(--extra)}

.tap{cursor:pointer;border:0;text-align:left;width:100%;display:block}
.tap:hover{filter:brightness(.985)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--extra-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.need{background:var(--need-soft);color:var(--need-ink)}
.pill.extra{background:var(--extra-soft);color:var(--warn)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* category bars */
.cats{display:flex;flex-direction:column;gap:11px}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.cat-row .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cat-row .bar i{display:block;height:100%;border-radius:99px}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;min-height:56px;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--display)}
.ico.N{background:var(--need-soft);color:var(--need-ink)} .ico.E{background:var(--extra-soft);color:var(--warn)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted)}
.item .a{font-weight:700;font-size:15px}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);padding:14px 2px 2px;text-transform:capitalize}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;min-height:40px;font-size:14px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:46px;font-size:16px}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:9px 6px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.cur td{font-weight:700}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

.cmp{display:flex;flex-direction:column;gap:14px}
.cmp .track{position:relative;height:8px;border-radius:99px;background:var(--surface-2);margin-top:6px}
.cmp .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.cmp .track b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;min-height:54px;color:var(--muted);font-size:12px;font-weight:600;border-radius:14px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;z-index:11;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(30,77,120,.35)}
.fab svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,22,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-height:46px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.amount-inp{font-family:var(--display);font-size:36px;font-weight:700;border:0;background:none;padding:4px 0;width:100%;letter-spacing:-.02em}
.amount-box{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--accent);margin-bottom:16px}
.amount-box span{font-family:var(--display);font-size:30px;color:var(--muted)}
.amount-box:focus-within{border-bottom-color:var(--ink)}
.amount-inp:focus-visible{outline:none}
.catpick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.catpick .chip[aria-pressed="true"].N{background:var(--need-ink);border-color:var(--need-ink);color:var(--on-need)}
.catpick .chip[aria-pressed="true"].E{background:var(--extra);border-color:var(--extra);color:#1b1305}
.grp-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 7px}
.actions{display:flex;gap:10px;margin-top:8px}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);padding:12px 0 6px;margin-top:10px;box-shadow:0 -14px 12px -8px var(--surface);z-index:2}
.btn{flex:1;border:0;border-radius:14px;padding:14px;min-height:50px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--ink);flex:0 0 auto;padding-inline:18px}
.btn.danger{background:var(--bad-soft);color:var(--bad);flex:0 0 auto;padding-inline:18px}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:-6px 0 8px}
.edit-row{display:grid;grid-template-columns:1fr 110px 46px;gap:8px;margin-bottom:8px;align-items:center}
.x{border:0;background:var(--surface-2);border-radius:12px;height:46px;width:46px;color:var(--muted);font-size:20px}
.add-line{border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;width:100%;color:var(--accent);font-weight:600;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.banner{background:var(--extra-soft);color:var(--ink);border-radius:14px;border-left:4px solid var(--extra);padding:12px 14px;font-size:14px}
.banner.row{align-items:center}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.undo{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;overflow:hidden;position:fixed}
.toast.undo button{border:0;background:var(--bg);color:var(--ink);font-weight:700;border-radius:9px;padding:8px 14px}
.toast.undo i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.toast.undo i{animation:none}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:block;text-align:center;cursor:pointer;margin-bottom:18px}
textarea.inp{resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;margin:2px 0 10px;padding:8px 0;min-height:44px}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.edit-row.p4{grid-template-columns:1fr 84px 82px 46px}
.guide h4{font-family:var(--display);font-size:16px;margin:16px 0 4px}
.guide p{margin:0;color:var(--ink);font-size:14.5px;max-width:62ch}
.guide p+p{margin-top:6px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1px dashed var(--line);background:var(--surface-2);border-radius:99px;padding:5px 11px;font-size:13px}
.sugg button span{color:var(--muted)}
.check.acc input{accent-color:var(--accent)}
.fisse-row{border-bottom:1px solid var(--line);padding:10px 0}
.fisse-row .fr1{display:grid;grid-template-columns:1fr 46px;gap:8px;margin-bottom:8px}
.fisse-row .fr2{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.fisse-row select{padding-inline:6px}
.ric{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ric:last-of-type{border-bottom:0}
.ric .btns{grid-column:1/-1;display:flex;gap:8px}
.ric .btns button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.ric .ok{background:var(--accent);color:var(--on-accent)} .ric .no{background:var(--surface-2);color:var(--muted)}
.prev-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.prev-row .meter{grid-column:1/-1;margin-top:2px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.set-item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 0;min-height:52px;border-top:1px solid var(--line);text-align:left}
.set-item:first-child{border-top:0}
.set-item .v{color:var(--muted);font-size:14px}

/* ===== Redesign 1.3: carta topografica ===== */
body{font-family:var(--body);font-size:15px}
.num,.big,.mid,.bigamt,.amount-inp,td,th,.pill{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-size:42px;font-weight:700;letter-spacing:-.04em}
.mid{font-size:20px;font-weight:600;letter-spacing:-.03em}
.bigamt{font-size:34px;letter-spacing:-.04em}
.item .a,.kv b,.prev-row b,.cat-row b{font-weight:600}
.pill{font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.app{padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}
main{gap:12px}
/* header */
.top{align-items:flex-end;padding:14px 16px 12px;background:var(--bg)}
.hd{min-width:0}
.kick{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top h1{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-transform:capitalize;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-act{display:flex;align-items:center;gap:2px;flex:none}

.hd-act button svg{width:20px;height:20px}
.hd-act button:hover{background:var(--surface-2);color:var(--ink)}
.hd-act button[aria-pressed="true"]{color:var(--accent)}
.hd-act .sep{width:1px;height:22px;background:var(--line);margin:0 4px}

.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em}

.ico{width:5px;height:34px;border-radius:3px;font-size:0;color:transparent}
.ico.N{background:var(--need)}.ico.E{background:var(--extra)}
.item .t{font-weight:600}

.btn,.hero .btn{border-radius:12px;font-weight:700}
.inp,.search{border-radius:10px}
.seg{border-radius:12px}.seg button{border-radius:9px}
.banner{border-radius:10px}
.sheet{border-radius:20px 20px 0 0}
.catpick .chip[aria-pressed="true"].E{color:#1b1305}
/* barra di navigazione fluttuante */
.tabs{left:0;right:0;bottom:0;background:none;border:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs nav{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--bar);border-radius:20px;padding:6px;gap:4px;box-shadow:0 10px 30px rgba(6,20,22,.28)}
.tabs button{color:var(--on-bar);min-height:50px;border-radius:14px;font-size:11.5px}
.tabs button[aria-current="page"]{background:var(--bar-act);color:var(--on-bar-act)}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:16px;width:56px;height:56px;background:var(--hero-acc);color:#062A24;box-shadow:0 8px 22px rgba(6,20,22,.3)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fab{background:var(--accent);color:#fff}}
:root[data-theme="light"] .fab{background:var(--accent);color:#fff}
.toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.meter,.cat-row .bar,.cmp .track{height:6px}
.meter i,.cat-row .bar i{border-radius:3px}
</style>

function tot(ym){
  const m=md(ym);let need=0,extra=0,ord=0,ann=0,ecc=0,buoni=0,carta=0;const byCat={};
  for(const s of m.spese){const c=catById(s.cat);const a=+s.importo||0;if(c.tipo==="E")extra+=a;else need+=a;byCat[c.id]=(byCat[c.id]||0)+a;
    if(s.k==="A")ann+=a;else if(s.k==="X")ecc+=a;else ord+=a;buoni+=+s.buoni||0;if(s.carta)carta+=a;}
  let ent=0,entR=0,entU=0,entB=0,entNc=0;
  for(const e of m.entrate){const v=+e.importo||0;ent+=v;if(e.nc)entNc+=v;const t=e.tipo||"R";if(t==="U")entU+=v;else if(t==="B")entB+=v;else entR+=v;}
  return{need,extra,tot:need+extra,byCat,ent,entR,entU,entB,entNc,ord,ann,ecc,buoni,carta,has:m.spese.length>0||m.entrate.length>0};
}

function quadratura(ym){
  const C=S.conti.conti||[];const sd=S.conti.saldi&&S.conti.saldi[ym];if(!C.length||!sd)return null;
  const t=tot(ym),m=md(ym),pm=ymShift(ym,-1),tp=tot(pm);
  const P1=patrim(C,ym),P0=patrim(C,pm);
  const entCash=t.ent-t.entNc;
  const addeb=m.addebitoCarta!=null?m.addebitoCarta:tp.carta;
  const usc=t.tot-t.buoni-t.carta+addeb;
  const att=entCash-usc,dlt=P1-P0;
  return{P0,P1,dlt,entCash,usc,att,scarto:dlt-att,addeb,stimato:m.addebitoCarta==null,cartaPrec:tp.carta,carta:t.carta,buoni:t.buoni,entNc:t.entNc,data:(S.conti.saldiData||{})[ym]||null};
}

function startMonth(year){for(let i=1;i<=12;i++){const k=year+"-"+pad(i);if(tot(k).has)return i;}return null;}
function residuo(ym){
  const y=ym.slice(0,4),m=+ym.slice(5);let st=startMonth(y);if(st==null||st>m)st=m;
  let r=0;for(let i=st;i<=m;i++){const k=y+"-"+pad(i);r+=budgetOf(k)-tot(k).extra;}return r;
}

const chains={};
function queue(key,fn){const p=(chains[key]||Promise.resolve()).then(fn,fn);chains[key]=p.catch(()=>{});return p;}
async function write(path,data){
  if(!S.db){toast("Memoria non disponibile: modifica non salvata");return false;}
  try{await queue(path,()=>S.db.doc(path).set(data));return true;}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await S.db.doc(path).set(data);return true;}catch(e2){}}
    REC={};toast(e&&e.code==="quota_exceeded"?"Archivio pieno: elimina dei dati vecchi":"Salvataggio non riuscito, riprova");return false;
  }
}
/* Annulla: ogni salvataggio registra lo stato precedente del documento; la barra "Annulla" lo ripristina per 10 secondi */
let REC={},NOREC=false;
function getLocal(path){if(path==="config/main")return S.cfg?clone(S.cfg):null;if(path==="conti/main")return S.contiExists?clone(S.conti):null;const ym=path.slice(5);return S.months[ym]?clone(S.months[ym]):null;}
function setLocal(path,d){if(path==="config/main")S.cfg=d;else if(path==="conti/main"){S.conti=d||{conti:[],saldi:{}};S.contiExists=!!d;}else{const ym=path.slice(5);if(d)S.months[ym]=d;else delete S.months[ym];}}
function record(path){if(NOREC)return;if(!(path in REC))REC[path]=getLocal(path);}
function saveMonth(ym,m){record("mesi/"+ym);S.months[ym]=m;render();return write("mesi/"+ym,m);}
function saveCfg(c){record("config/main");S.cfg=c;render();return write("config/main",c);}
function saveConti(c){record("conti/main");S.conti=c;S.contiExists=true;render();return write("conti/main",c);}
async function delDoc(path){record(path);setLocal(path,null);render();if(!S.db)return false;
  try{await queue(path,()=>S.db.doc(path).delete());return true;}catch(e){REC={};toast("Eliminazione non riuscita, riprova");return false;}}
async function restore(prev){NOREC=true;let ok=true;
  try{for(const [p,d] of Object.entries(prev))setLocal(p,d);render();
    for(const [p,d] of Object.entries(prev)){if(d==null){try{await queue(p,()=>S.db.doc(p).delete());}catch(e){ok=false;}}else ok=(await write(p,d))&&ok;}}
  finally{NOREC=false;}return ok;}

function chartSVG(year,data){
  const W=340,H=170,L=34,R=6,T=10,Bt=22,iw=W-L-R,ih=H-T-Bt;
  const mx=Math.max(1,...data.map(d=>Math.max(d.tot,d.ent)));
  const step=Math.pow(10,Math.floor(Math.log10(mx)));let top=Math.ceil(mx/step)*step;if(top/step<=2)top=Math.ceil(mx/(step/2))*(step/2);
  const y=v=>T+ih-(v/top)*ih;const bw=iw/12;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Uscite ed entrate mensili '+year+'">';
  for(let i=0;i<=2;i++){const v=top*i/2;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+(v>=1000?(v/1000).toLocaleString("it-IT")+"k":v)+'</text>';}
  data.forEach((d,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;
    if(d.need>0)s+='<rect x="'+x+'" y="'+y(d.need)+'" width="'+w+'" height="'+(y(0)-y(d.need))+'" fill="var(--need)" rx="2"/>';
    if(d.extra>0)s+='<rect x="'+x+'" y="'+y(d.tot)+'" width="'+w+'" height="'+(y(d.need)-y(d.tot))+'" fill="var(--extra)" rx="2"/>';
    if(d.ent>0)s+='<line x1="'+(x-3)+'" x2="'+(x+w+3)+'" y1="'+y(d.ent)+'" y2="'+y(d.ent)+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-7)+'" text-anchor="middle">'+MESI_B[i].slice(0,1)+'</text>';});
  return s+'</svg>';
}

  h+='<div class="sect-h"><h2>Rispetto al budget</h2></div><section class="card"><div class="cmp">'+
     line("Necessità",act&&act.N,bN,"need",false)+line("Extra",act&&act.E,bE,"extra",false)+line("Risparmio",act&&act.R,bR,"good",true)+

    data.map(d=>{const r=d.ent-d.tot;return'<tr class="click'+(d.k===S.ym?' cur':'')+'" data-act="goMonth" data-v="'+d.k+'"><td>'+MESI_B[d.i-1]+'</td><td>'+(d.tot?eur0.format(d.tot):'–')+'</td><td>'+(d.ent?eur0.format(d.ent):'–')+'</td><td class="'+(d.ent?(r>=0?'pos':'neg'):'')+'">'+(d.ent?eur0.format(r):'–')+'</td><td class="'+(d.res!=null&&d.res<0?'neg':'')+'">'+(d.res==null?'–':eur0.format(d.res))+'</td></tr>'}).join("")+

function patrimSVG(pts){

  const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)),y=v=>T+ih-((v-mn)/(mx-mn))*ih;
  const line=k=>pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Patrimonio totale e fondo libero mese per mese">';
  for(let i=0;i<=2;i++){const v=mn+(mx-mn)*i/2;o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+(Math.abs(v)>=1000?(v/1000).toLocaleString("it-IT",{maximumFractionDigits:1})+"k":Math.round(v))+'</text>';}

}

function cleanBackup(raw){

    budget:cleanB(raw.config.budget)};

  cfg.ricorrentiE=(Array.isArray(raw.config.ricorrentiE)?raw.config.ricorrentiE:[]).filter(r=>r&&r.id).map(r=>{const o={id:str(r.id),desc:str(r.desc),importo:num(r.importo),tipo:r.tipo==="U"||r.tipo==="B"?r.tipo:"R",nc:!!r.nc,dal:/^\d{4}-\d{2}$/.test(r.dal)?r.dal:ymNow(),attiva:r.attiva!==false};if(/^\d{4}-\d{2}$/.test(r.al))o.al=r.al;return o;});
  if(raw.config.chiusura&&typeof raw.config.chiusura==="object")cfg.chiusura={orig:str(raw.config.chiusura.orig),dest:str(raw.config.chiusura.dest),soglia:num(raw.config.chiusura.soglia)};
  if(raw.config.ultimoBackup&&/^\d{4}-\d{2}-\d{2}$/.test(raw.config.ultimoBackup))cfg.ultimoBackup=raw.config.ultimoBackup;

      entrate:(m.entrate||[]).map(e=>{const o={id:str(e.id)||uid(),desc:str(e.desc),importo:num(e.importo)};if(e.tipo==="U"||e.tipo==="B")o.tipo=e.tipo;if(e.nc)o.nc=true;if(e.ric)o.ric=str(e.ric);return o;}),budgetExtra:m.budgetExtra==null?null:num(m.budgetExtra),saltate:(m.saltate||[]).map(str),addebitoCarta:m.addebitoCarta==null?null:num(m.addebitoCarta)};
  }
  const rc=raw.conti||{};const conti={conti:(rc.conti||[]).filter(a=>a&&a.id).map(a=>{const o={id:str(a.id),nome:str(a.nome),tipo:str(a.tipo),saldoIniziale:num(a.saldoIniziale)};if(+a.quota>0&&+a.quota<1)o.quota=num(a.quota);if(Array.isArray(a.riserve))o.riserve=a.riserve.map(r=>({nome:str(r.nome),importo:num(r.importo),tipo:r.tipo==="A"?"A":"V",da:/^\d{4}-\d{2}$/.test(r.da)?r.da:""}));return o;}),saldi:{},saldiData:{}};

    for(const [ym,m] of Object.entries(bk.mesi)){const cur=clone(md(ym));const ids=new Set(cur.spese.map(x=>x.id));
      m.spese.forEach(x=>{if(!ids.has(x.id)){cur.spese.push(x);n++;}});
      if(!cur.entrate.length)cur.entrate=m.entrate;if(cur.budgetExtra==null)cur.budgetExtra=m.budgetExtra;if(cur.addebitoCarta==null)cur.addebitoCarta=m.addebitoCarta;mesi[ym]=cur;}
    conti=clone(S.conti);conti.conti=conti.conti||[];conti.saldi=conti.saldi||{};
    bk.conti.conti.forEach(a=>{if(!conti.conti.some(x=>x.id===a.id))conti.conti.push(a)});
    conti.saldiData=conti.saldiData||{};for(const [ym,d] of Object.entries(bk.conti.saldiData||{}))if(!conti.saldiData[ym])conti.saldiData[ym]=d;
    for(const [ym,o] of Object.entries(bk.conti.saldi)){conti.saldi[ym]=conti.saldi[ym]||{};for(const [k,v] of Object.entries(o))if(conti.saldi[ym][k]==null)conti.saldi[ym][k]=v;}
  }
  REC={};
  ok=(await saveCfg(cfg))&&ok;
  for(const [ym,m] of Object.entries(mesi))ok=(await saveMonth(ym,m))&&ok;
  if(mode==="replace"){for(const ym of Object.keys(S.months)){if(!mesi[ym])ok=(await delDoc("mesi/"+ym))&&ok;}}
  ok=(await saveConti(conti))&&ok;
  render();if(ok){const msg="Backup importato: "+n+" spes"+(n===1?"a":"e");if(mode==="replace")undoToast(msg);else toast(msg);}else{REC={};toast("Importazione incompleta: riprova");}
}
function readBackup(text,errEl){
  try{const bk=cleanBackup(JSON.parse(text));sheetImport(bk);}
  catch(err){const m=err instanceof SyntaxError?"Il contenuto non è leggibile: serve il file .json esportato dall’app, copiato per intero.":err.message;if(errEl)errEl.textContent=m;else toast(m);}
}
function sheetImportPick(){
  openSheet('<h3>Importa backup</h3><p class="sub" style="margin:-8px 0 14px">Scegli il file .json che hai esportato dall’app.</p>'+
    '<label class="btn" for="imp-f">Scegli il file<input type="file" id="imp-f" class="vh"></label>'+
    '<div class="grp-l" style="color:var(--muted)">Se la scelta del file non funziona</div>'+
    '<p class="sub" style="margin:0 0 10px">Se il selettore non si apre o il file risulta grigio, apri il backup con un’app per i file di testo, copia tutto il contenuto e incollalo qui sotto.</p>'+
    '<textarea class="inp" id="imp-t" rows="4" placeholder="Incolla qui il contenuto del backup" spellcheck="false"></textarea>'+
    '<div class="err" id="imp-err" style="margin-top:8px"></div><div class="actions"><button type="button" class="btn ghost" data-act="close">Annulla</button><button type="button" class="btn" id="imp-go">Leggi il testo</button></div>',
  sh=>{const err=sh.querySelector("#imp-err");
    sh.querySelector("#imp-f").addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;
      try{readBackup(await file.text(),err);}catch(x){err.textContent="Non riesco a leggere il file scelto.";}});
    sh.querySelector("#imp-go").onclick=()=>{const t=sh.querySelector("#imp-t").value.trim();if(!t){err.textContent="Incolla prima il contenuto del file.";return;}readBackup(t,err);};});
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;

  if(a==="close"){closeSheet();return;}
  if(a==="tab"){S.view=el.dataset.v;try{localStorage.setItem("bt.view",S.view)}catch(x){}window.scrollTo(0,0);render();return;}
  if(a==="privacy"){S.privacy=!S.privacy;try{localStorage.setItem("easybilance_privacy",S.privacy?"1":"0");}catch(x){}render();return;}
  if(a==="month"){S.ym=ymShift(S.ym,+el.dataset.k);S.fcat=null;render();return;}
  if(a==="year"){S.ym=(+S.ym.slice(0,4)+ +el.dataset.k)+S.ym.slice(4);render();return;}
  if(a==="goMonth"){S.ym=el.dataset.v;S.view="home";window.scrollTo(0,0);render();return;}
  if(a==="import"){if(!S.db){toast("Memoria non disponibile");return;}return sheetImportPick();}

  if(a==="edit")return sheetSpesa(el.dataset.ym,el.dataset.id);
  if(a==="fcat"){S.fcat=el.dataset.v||null;render();return;}
  if(a==="entrate")return sheetEntrate(S.ym);
  if(a==="imp"){S.view=S.view==="imp"?"home":"imp";try{localStorage.setItem("bt.view",S.view)}catch(x){}window.scrollTo(0,0);render();return;}
  if(a==="contiTab"){S.contiTab=el.dataset.v;render();return;}
  if(a==="chiusura")return sheetChiusura(el.dataset.ym||S.ym,1);
  if(a==="chiusuraCfg")return sheetChiusuraCfg(null);
  if(a==="backupShare")return shareBackup();
  if(a==="warnQ"){const q=nSenzaQuota(S.ym);S.view="spese";S.fcat=q.length?q[0].cat:null;S.q="";window.scrollTo(0,0);render();return;}
  if(a==="carta")return sheetCarta();
  if(a==="ricEList")return sheetRicEList();
  if(a==="ricEOk")return ricEConfirm([el.dataset.id]);
  if(a==="ricEAll")return ricEConfirm(dueRicE(S.ym).map(r=>r.id));
  if(a==="ricENo")return ricESkip(el.dataset.id);
  if(a==="budgetMese")return sheetBudgetMese();
  if(a==="editEntrate"){const y=curY();return sheetRows("Reddito netto "+y,"Le voci che compongono il reddito netto dell’anno.",B(y).entrate,"importo","€/anno",out=>saveBudget(y,{entrate:out.map(r=>({voce:r.voce,importo:r.n}))},"Reddito "+y+" aggiornato"));}
  if(a==="editFisse")return sheetFisse(curY());
  if(a==="editPct")return sheetPct();
  if(a==="editCats")return sheetCats();
  if(a==="acc")return sheetAcc(el.dataset.id||null);
  if(a==="saldi")return sheetSaldi();
  if(a==="export")return exportCSV();
  if(a==="backup")return exportBackup();
  if(a==="reset")return sheetReset();
  if(a==="ricList")return sheetRicList();
  if(a==="ricOk")return ricConfirm([el.dataset.id]);
  if(a==="ricAll")return ricConfirm(dueRic(S.ym).map(r=>r.id));
  if(a==="ricNo")return ricSkip(el.dataset.id);
  if(a==="guide")return sheetGuide();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render();}});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sec){try{localStorage.setItem("eb.sec."+d.dataset.sec,d.open?"1":"0");}catch(x){}}},true);
document.addEventListener("keydown",e=>{
  if(!$("#sheet-root").innerHTML)return;
  if(e.key==="Escape"){closeSheet();return;}
  if(e.key==="Tab"){const sh=$("#sheet-root .sheet");if(!sh)return;const fs=[...sh.querySelectorAll('button,input:not([type=hidden]),select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fs.length)return;
    const a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&(document.activeElement===a||!sh.contains(document.activeElement))){e.preventDefault();z.focus();}else if(!e.shiftKey&&(document.activeElement===z||!sh.contains(document.activeElement))){e.preventDefault();a.focus();}}
});

/* ---------- archivio locale (memoria del browser) ---------- */
function localDB(){
  const P="easybilance:";
  try{localStorage.setItem(P+"__t","1");localStorage.removeItem(P+"__t");}catch(e){return null;}
  const subs=new Map();
  const read=k=>{try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):null;}catch(e){return null;}};
  const snap=path=>{const d=read(path);return{id:path.split("/").pop(),exists:d!=null,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}};};
  const keys=col=>{const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(P+col+"/"))out.push(k.slice(P.length));}return out.sort();};
  const emit=path=>{(subs.get(path)||[]).forEach(f=>f());(subs.get("col:"+path.split("/")[0])||[]).forEach(f=>f());};
  const on=(key,fn)=>{if(!subs.has(key))subs.set(key,[]);subs.get(key).push(fn);setTimeout(fn,0);return()=>{const a=subs.get(key);a.splice(a.indexOf(fn),1);};};
  window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith(P))emit(e.key.slice(P.length));});
  return{
    doc:path=>({
      get:async()=>snap(path),
      set:async d=>{try{localStorage.setItem(P+path,JSON.stringify(d));}catch(e){throw{code:"quota_exceeded",message:"Memoria piena"};}emit(path);},
      delete:async()=>{localStorage.removeItem(P+path);emit(path);},
      onSnapshot:(n)=>on(path,()=>n(snap(path)))}),
    collection:col=>({onSnapshot:(n)=>on("col:"+col,()=>n({docs:keys(col).map(snap)}))})
  };
}
const localDownloads={save:async({filename,data})=>{
  const type=filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/json";const blob=new Blob([data],{type});
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:"saved"};}};

/* ---------- boot ---------- */
render();
(function(){
  const db=localDB();
  S.dl=localDownloads;
  if(!db){S.dbState="off";S.cfgLoaded=S.monthsLoaded=true;render();return;}
  S.db=db;S.dbState="on";
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  let novitaFatta=false;
  db.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.cfgLoaded=true;render();if(!novitaFatta){novitaFatta=true;checkNovita();}});
  db.collection("mesi").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.months=o;S.monthsLoaded=true;render();});
  db.doc("conti/main").onSnapshot(s=>{S.contiExists=s.exists;S.conti=s.exists?s.data():{conti:[],saldi:{}};render();});
})();
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
})();
